name: Build LifeMonitor APK

on:
  push:
    branches: ["claude/phone-usage-monitor-app-yz5kkg", "main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --project-dir phone-monitor

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeMonitor-debug
          path: phone-monitor/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
