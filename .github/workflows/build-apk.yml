name: Build WA Scheduler APK

on:
  push:
    branches:
      - 'claude/wa-scheduler-android-apk-zs5ow6'
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install required SDK components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x wascheduler/gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: wascheduler

      - name: Show APK info
        run: |
          APK=wascheduler/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            echo "✅ APK built successfully"
            echo "Path: $APK"
            echo "Size: $(du -sh $APK | cut -f1)"
          else
            echo "❌ APK not found"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wa-scheduler-debug-apk
          path: wascheduler/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload mapping and build info
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-outputs
          path: wascheduler/app/build/outputs/
          retention-days: 7
