name: Build Android APK

on:
  push:
    branches: [claude/nutritionist-fitness-tracking-app-mhqdkz, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node 22 ─────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 3. Install mobile-app deps & build ─────────────────────────
      - name: Install dependencies
        working-directory: mobile-app
        run: npm install --ignore-scripts

      - name: Build Vite React app
        working-directory: mobile-app
        run: npm run build

      - name: Verify dist
        run: |
          test -f mobile-app/dist/index.html && echo "✅ index.html present"
          ls mobile-app/dist/

      # ── 4. Java 21 ─────────────────────────────────────────────────
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 5. Android SDK ─────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # ── 6. Capacitor ───────────────────────────────────────────────
      - name: Add & sync Capacitor Android
        working-directory: mobile-app
        run: |
          npx cap add android
          npx cap sync android

      # ── 7. Brand colors ────────────────────────────────────────────
      - name: Apply brand colors
        working-directory: mobile-app
        run: |
          cat > android/app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="colorPrimary">#10b981</color>
            <color name="colorPrimaryDark">#059669</color>
            <color name="colorAccent">#10b981</color>
          </resources>
          EOF
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">My Favourite Nutritionist</string>|' \
            android/app/src/main/res/values/strings.xml || true

      # ── 8. Build APK ───────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x mobile-app/android/gradlew

      - name: Build Debug APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      # ── 9. Upload APK ──────────────────────────────────────────────
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp mobile-app/android/app/build/outputs/apk/debug/app-debug.apk \
             dist/MyFavouriteNutritionist-debug.apk
          echo "APK size: $(du -sh dist/MyFavouriteNutritionist-debug.apk | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyFavouriteNutritionist-APK
          path: dist/MyFavouriteNutritionist-debug.apk
          retention-days: 30

      # ── 10. PR comment ─────────────────────────────────────────────
      - name: Comment APK link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '## 📱 APK Build Ready!',
                '',
                '**My Favourite Nutritionist** — full fitness & nutrition tracking app.',
                '',
                `🔗 **[Download APK → Artifacts](${runUrl})**`,
                '',
                '**Install on Android:**',
                '1. Download `MyFavouriteNutritionist-APK.zip` from Artifacts',
                '2. Unzip → `MyFavouriteNutritionist-debug.apk`',
                '3. Settings → Security → **Install unknown apps** (enable)',
                '4. Open APK on phone and install',
                '',
                `_Build \`${context.sha.slice(0,7)}\`_`
              ].join('\n')
            });
