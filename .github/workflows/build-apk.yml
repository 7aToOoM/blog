name: Build Android APK

on:
  push:
    branches: [claude/nutritionist-fitness-tracking-app-mhqdkz, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node setup ──────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # ── 3. Build Next.js static export ────────────────────────────
      - name: Export Next.js as static site
        run: npm run export
        env:
          NODE_ENV: production

      # Verify nutritionist page was exported
      - name: Verify export
        run: ls out/ && test -f out/nutritionist.html && echo "✅ nutritionist.html found"

      # ── 4. Java setup ──────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 5. Android SDK setup ───────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      # ── 6. Capacitor: add Android platform ────────────────────────
      - name: Add Capacitor Android platform
        run: |
          npx cap add android
          npx cap sync android

      # ── 7. Customise app colors ───────────────────────────────────
      - name: Set brand colors
        run: |
          cat > android/app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="colorPrimary">#10b981</color>
            <color name="colorPrimaryDark">#059669</color>
            <color name="colorAccent">#10b981</color>
          </resources>
          EOF

          # Patch app name in strings.xml
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">My Favourite Nutritionist</string>|' \
            android/app/src/main/res/values/strings.xml || true

      # ── 8. Build debug APK ────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      # ── 9. Rename & upload APK ────────────────────────────────────
      - name: Prepare APK for upload
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             dist/MyFavouriteNutritionist-debug.apk
          echo "APK size: $(du -sh dist/MyFavouriteNutritionist-debug.apk | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyFavouriteNutritionist-APK
          path: dist/MyFavouriteNutritionist-debug.apk
          retention-days: 30

      # ── 10. Comment on PR with download instructions ───────────────
      - name: Comment APK download link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '## 📱 APK Build Ready!',
                '',
                '**My Favourite Nutritionist** debug APK has been built successfully.',
                '',
                `🔗 **[Download APK → Artifacts section](${runUrl})**`,
                '',
                '**Install steps:**',
                '1. Download `MyFavouriteNutritionist-APK.zip` from the Artifacts section',
                '2. Unzip to get `MyFavouriteNutritionist-debug.apk`',
                '3. On your Android phone: **Settings → Security → Install unknown apps** (enable for your file manager)',
                '4. Open the APK and install',
                '',
                `_Build: \`${context.sha.slice(0, 7)}\` · Runner: ubuntu-latest_`
              ].join('\n')
            });
